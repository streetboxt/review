<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2a1233">
<title>How was our date?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #2a1233;
    --plum: #3d1b4a;
    --blush: #f6d9df;
    --peach: #ffb59e;
    --lilac: #b9a3e3;
    --ink: #2a1233;
    --paper: #fff6f4;
    --line: rgba(42, 18, 51, 0.18);
    --star: #ff8a6b;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100dvh; display: flex; align-items: center;
    justify-content: center; padding: 24px 16px;
    font-family: "Figtree", system-ui, sans-serif; color: var(--blush);
    background:
      radial-gradient(60rem 40rem at 85% -10%, rgba(255, 181, 158, 0.28), transparent 60%),
      radial-gradient(50rem 40rem at -10% 110%, rgba(185, 163, 227, 0.25), transparent 60%),
      var(--night);
  }
  main { width: 100%; max-width: 440px; }
  h1, h2 { font-family: "Young Serif", Georgia, serif; font-weight: 400; line-height: 1.15; margin: 0 0 12px; }
  p { line-height: 1.55; margin: 0 0 16px; }
  [hidden] { display: none !important; }
  .gate h1 { font-size: 2rem; }
  .gate p { color: rgba(246, 217, 223, 0.85); }
  .code-input {
    width: 100%; font: 600 1.6rem/1.3 "Figtree", system-ui, sans-serif;
    letter-spacing: 0.12em; text-align: center; padding: 18px 12px;
    color: var(--blush); background: rgba(255, 255, 255, 0.07);
    border: 2px solid rgba(246, 217, 223, 0.35); border-radius: 14px; outline: none;
  }
  .code-input::placeholder { color: rgba(246, 217, 223, 0.3); letter-spacing: 0.08em; }
  .code-input:focus-visible { border-color: var(--peach); box-shadow: 0 0 0 4px rgba(255, 181, 158, 0.25); }
  .code-input.shake { animation: shake 0.4s; border-color: #ff8f8f; }
  @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
  .error { min-height: 1.5em; margin: 10px 0 14px; color: #ffb3b3; font-size: 0.95rem; }
  .field-label { display: block; font-weight: 600; font-size: 1rem; margin-bottom: 8px; }
  .btn {
    display: block; width: 100%; font: 600 1.05rem "Figtree", system-ui, sans-serif;
    padding: 16px; border: 0; border-radius: 14px; cursor: pointer;
    color: var(--ink); background: var(--peach);
  }
  .btn:hover { background: #ffc4b0; }
  .btn:focus-visible { outline: 3px solid var(--blush); outline-offset: 3px; }
  .btn:disabled { opacity: 0.6; cursor: wait; }

  .ticket { position: relative; background: var(--paper); color: var(--ink); border-radius: 22px; overflow: hidden; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45); }
  .ticket-top { padding: 30px 26px 24px; }
  .ticket-top h2 { font-size: 2rem; }
  .ticket-top p { margin: 0; color: #5a3f66; }
  .perf { position: relative; height: 0; border-top: 2px dashed var(--line); margin: 0 18px; }
  .perf::before, .perf::after { content: ""; position: absolute; top: -13px; width: 24px; height: 24px; border-radius: 50%; background: var(--plum); }
  .perf::before { left: -30px; } .perf::after { right: -30px; }
  .ticket-body { padding: 24px 26px 28px; }
  fieldset { border: 0; padding: 0; margin: 0 0 22px; min-width: 0; }
  legend { font-weight: 600; font-size: 1rem; padding: 0; margin-bottom: 4px; }
  .hint { font-size: 0.88rem; color: #6b5478; margin: 0 0 12px; }

  .rate { margin: 0 0 20px; }
  .rate-label { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-weight: 600; margin-bottom: 6px; }
  .rate-count { font-size: 0.85rem; font-weight: 500; color: #6b5478; }
  .stars { display: flex; gap: 4px; }
  .star {
    flex: 1; max-width: 56px; aspect-ratio: 1; padding: 0; border: 0; background: none; cursor: pointer;
    font-size: 2.3rem; line-height: 1; color: rgba(42, 18, 51, 0.2);
    transition: color 0.12s, transform 0.12s; -webkit-tap-highlight-color: transparent;
  }
  .star.on { color: var(--star); }
  .star:active { transform: scale(0.88); }
  .star:focus-visible { outline: 3px solid var(--lilac); outline-offset: 2px; border-radius: 10px; }
  .rate.missing .rate-label { color: #b3261e; }

  .choices { display: grid; gap: 8px; }
  .choice { position: relative; display: block; }
  .choice input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .choice span {
    display: block; padding: 14px 16px; font-weight: 600; line-height: 1.35;
    border: 2px solid var(--line); border-radius: 14px; cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .choice input:checked + span { background: var(--ink); border-color: var(--ink); color: var(--blush); }
  .choice input:focus-visible + span { outline: 3px solid var(--lilac); outline-offset: 2px; }

  textarea {
    width: 100%; font: 500 1rem "Figtree", system-ui, sans-serif; padding: 13px 12px;
    color: var(--ink); background: #fff; border: 2px solid var(--line); border-radius: 12px;
    resize: vertical; min-height: 76px;
  }
  textarea:focus-visible { outline: 3px solid var(--lilac); outline-offset: 1px; }
  .form-error { min-height: 1.4em; margin: 0 0 10px; color: #b3261e; font-size: 0.92rem; }
  .done { text-align: center; } .done h2 { font-size: 2.1rem; }
  .done p { color: rgba(246, 217, 223, 0.85); }
  @media (max-width: 360px) { .ticket-top, .ticket-body { padding-left: 20px; padding-right: 20px; } .star { font-size: 2rem; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
  <section class="gate" id="welcome">
    <h1 id="welcome-title"></h1>
    <p>Ready to tell me how I did?</p>
    <button class="btn" id="start" type="button">Let's do it</button>
  </section>

  <section id="review" hidden>
    <div class="ticket">
      <div class="ticket-top">
        <h2>So, How Did I Do?👀💗</h2>
        <p>Tap a star to rate each one. Be honest, I can take it.</p>
      </div>
      <div class="perf" aria-hidden="true"></div>
      <div class="ticket-body">
        <div id="ratings"></div>

        <fieldset>
          <legend>Clear for third date? 🏀</legend>
          <p class="hint">Choose the one that fits.</p>
          <div class="choices" id="choices"></div>
        </fieldset>

        <fieldset>
          <label class="field-label" for="favorite">Favorite moment</label>
          <p class="hint">Optional.</p>
          <textarea id="favorite" maxlength="1000"></textarea>
        </fieldset>
        <fieldset>
          <label class="field-label" for="better">Anything I can do better?</label>
          <p class="hint">Optional.</p>
          <textarea id="better" maxlength="1000"></textarea>
        </fieldset>

        <p class="form-error" id="form-error" role="alert" aria-live="polite"></p>
        <button class="btn" id="send" type="button">Send my review</button>
      </div>
    </div>
  </section>

  <section class="done" id="done" hidden>
    <h2 id="done-title"></h2>
    <p id="done-text"></p>
  </section>
</main>

<script>
  // EDIT THESE SETTINGS
  const CONFIG = {
    name: "Jhy",
    formspreeId: "xeaaoqzj"
  };

  const CATEGORIES = [
    ["overall", "Overall date 💗"],
    ["food", "The food 🍴"],
    ["company", "The company (me 😌)"],
    ["conversation", "Conversation"],
    ["vibe", "The vibe"],
    ["place", "The place we picked"],
    ["comfort", "How comfortable you felt"],
    ["another", "Would you go on another date? 👀"]
  ];

  const THIRD_DATE = [
    "Yes, let's keep the ball rolling 🏀",
    "Yes, but let's plan it together 😌",
    "Maybe, let's talk about it",
    "Not yet, I need a little more time",
    "No, but thank you for the date"
  ];

  const $ = (id) => document.getElementById(id);
  const ratings = {};
  let thirdDate = "";

  // ---------- Welcome ----------
  $("welcome-title").textContent = "Hi " + CONFIG.name + " \uD83D\uDC97";
  $("start").addEventListener("click", () => {
    $("welcome").hidden = true;
    $("review").hidden = false;
    window.scrollTo(0, 0);
  });

  // ---------- Star ratings ----------
  function paint(row, value) {
    row.querySelectorAll(".star").forEach((s, i) => {
      s.classList.toggle("on", i < value);
    });
  }

  CATEGORIES.forEach(([key, label]) => {
    const row = document.createElement("div");
    row.className = "rate";
    row.dataset.key = key;
    row.innerHTML =
      '<div class="rate-label"><span id="lbl-' + key + '">' + label + '</span><span class="rate-count" id="cnt-' + key + '"></span></div>' +
      '<div class="stars" role="radiogroup" aria-labelledby="lbl-' + key + '"></div>';
    const wrap = row.querySelector(".stars");

    for (let n = 1; n <= 5; n++) {
      const star = document.createElement("button");
      star.type = "button";
      star.className = "star";
      star.textContent = "★";
      star.setAttribute("role", "radio");
      star.setAttribute("aria-checked", "false");
      star.setAttribute("aria-label", n + (n === 1 ? " star" : " stars"));
      star.addEventListener("click", () => {
        ratings[key] = n;
        paint(row, n);
        wrap.querySelectorAll(".star").forEach((s, i) => s.setAttribute("aria-checked", i + 1 === n ? "true" : "false"));
        $("cnt-" + key).textContent = n + " / 5";
        row.classList.remove("missing");
      });
      if (window.matchMedia("(hover: hover)").matches) {
        star.addEventListener("mouseenter", () => paint(row, n));
      }
      wrap.appendChild(star);
    }
    wrap.addEventListener("mouseleave", () => paint(row, ratings[key] || 0));
    $("ratings").appendChild(row);
  });

  // ---------- Third date choices ----------
  THIRD_DATE.forEach((text) => {
    const label = document.createElement("label");
    label.className = "choice";
    const input = document.createElement("input");
    input.type = "radio";
    input.name = "third";
    input.value = text;
    input.addEventListener("change", () => { thirdDate = text; });
    const span = document.createElement("span");
    span.textContent = text;
    label.append(input, span);
    $("choices").appendChild(label);
  });

  // ---------- Send ----------
  $("send").addEventListener("click", async () => {
    const missing = CATEGORIES.filter(([k]) => !ratings[k]);
    document.querySelectorAll(".rate").forEach((r) => r.classList.toggle("missing", !ratings[r.dataset.key]));

    if (missing.length) {
      $("form-error").textContent = "Give every line a star rating first.";
      document.querySelector(".rate.missing").scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    if (!thirdDate) {
      $("form-error").textContent = "Pick an answer for the third date.";
      return;
    }
    $("form-error").textContent = "";

    const payload = {
      _subject: CONFIG.name + " reviewed the date: " + ratings.overall + "/5 overall",
      third_date: thirdDate,
      favorite_moment: $("favorite").value.trim() || "(none)",
      do_better: $("better").value.trim() || "(none)"
    };
    CATEGORIES.forEach(([k, label]) => { payload["rating_" + k] = ratings[k] + "/5"; });

    $("send").disabled = true;
    let ok = false;
    try {
      const res = await fetch("https://formspree.io/f/" + encodeURIComponent(CONFIG.formspreeId), {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify(payload)
      });
      ok = res.ok;
    } catch (e) { ok = false; }

    if (!ok) {
      $("form-error").textContent = "That didn't send. Check your connection and try again.";
      $("send").disabled = false;
      return;
    }

    $("review").hidden = true;
    $("done").hidden = false;
    window.scrollTo(0, 0);
    if (thirdDate.startsWith("Yes")) {
      $("done-title").textContent = "Third date, here we come.";
      $("done-text").textContent = "Thank you, " + CONFIG.name + ". I got your review and I'll message you soon.";
    } else {
      $("done-title").textContent = "Thank you for being honest.";
      $("done-text").textContent = "I got your review, " + CONFIG.name + ". I really appreciate it.";
    }
  });
</script>
</body>
</html>
